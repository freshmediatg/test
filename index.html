<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PICTS Schwerpunkte</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --brand: #1B73CC;
    --brand-bg: #E8F1FB;
    --bg: #F7F6F3;
    --surface: #FFFFFF;
    --border: rgba(0,0,0,0.08);
    --text-primary: #1A1A18;
    --text-secondary: #5A5A54;
    --text-tertiary: #9A9A90;
  }

  body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    padding: 0;
    margin: 0;
  }

  .kopfzeile {
    background: var(--brand);
    color: #fff;
    padding: 14px 40px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .03em;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 24px 56px;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 32px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--brand);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-decoration: none;
    color: var(--text-primary);
    transition: box-shadow 0.2s;
  }

  .card:hover {
    box-shadow: 0 4px 18px rgba(0,0,0,0.07);
  }

  .card-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .card-sub {
    font-size: 12px;
    color: var(--text-tertiary);
  }

  .card-arrow {
    font-size: 20px;
    color: var(--brand);
  }

  .coming-soon {
    opacity: 0.4;
    pointer-events: none;
  }

  .badge {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    background: var(--brand-bg);
    color: var(--brand);
    padding: 3px 8px;
    border-radius: 20px;
    margin-left: 10px;
  }
</style>
</head>
<body>

<div class="kopfzeile">Leitung Digitalität &nbsp;·&nbsp; Schule Illnau-Effretikon &nbsp;·&nbsp; Schuljahr 26/27</div>

<div class="page">
  <h1>PICTS-SCHWERPUNKTTHEMEN</h1>

  <a href="hagenwatt.html" class="card">
    <div>
      <p class="card-title">Sek Hagen/Watt</p>
      <p class="card-sub">Schwerpunkte Digitalität · SJ 26/27</p>
    </div>
    <span class="card-arrow">→</span>
  </a>

  <a href="primar.html" class="card">
    <div>
      <p class="card-title">Primar</p>
      <p class="card-sub">Schwerpunkte Digitalität · SJ 26/27</p>
    </div>
    <span class="card-arrow">→</span>
  </a>

  <div class="card coming-soon">
    <div>
      <p class="card-title">Kindergarten <span class="badge">Folgt</span></p>
      <p class="card-sub">Schwerpunkte Digitalität · SJ 26/27</p>
    </div>
    <span class="card-arrow">→</span>
  </div>

</div>
</body>
</html>
